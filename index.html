<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#16120f">
	<meta name="description" content="Pick genres, ratings and actors, press Start, and watch movie trailers back to back.">
	<title>Endless Trailers</title>
	<link rel="preload" href="fonts/anton-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
	<script>
		// Apply saved theater mode before first paint so a dark room doesn't get a white flash
		try { if (localStorage.getItem("endlessTrailers.theater") === "1") document.documentElement.classList.add("theater"); } catch (e) {}
	</script>
	<!-- Bump ?v= on every release so phones don't keep stale CSS/JS from cache -->
	<link href="css/style.css?v=6" rel="stylesheet">
</head>
<body>
	<header class="topbar">
		<a class="brand" href="./">Endless <span>Trailers</span></a>
		<form class="title-search" id="trailerSearch" role="search">
			<label class="visually-hidden" for="searchText">Find one movie's trailer</label>
			<input id="searchText" type="search" placeholder="Find a movie by title" autocomplete="off" enterkeyhint="search">
			<button class="btn btn-ghost" type="submit">Find</button>
		</form>
	</header>

	<main class="layout">
		<section class="stage" aria-label="Trailer player">
			<div class="screen">
				<div id="player"></div>
				<div class="screen-idle" id="screenIdle">
					<p class="idle-kicker">Now showing</p>
					<p class="idle-title">Trailers, back to back</p>
					<p class="idle-text">Pick any filters, then press <strong>Start</strong>.</p>
				</div>
			</div>

			<div class="transport" role="group" aria-label="Playback">
				<button class="btn btn-start" id="startBtn" type="button" disabled>
					<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
					<span id="startLabel">Start</span>
				</button>
				<button class="btn btn-stop" id="stopBtn" type="button" disabled>
					<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
					<span>Stop</span>
				</button>
				<button class="btn btn-ghost btn-icon" id="prevBtn" type="button" disabled aria-label="Previous trailer" title="Previous trailer">
					<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
				</button>
				<button class="btn btn-ghost btn-icon" id="nextBtn" type="button" disabled aria-label="Next trailer" title="Next trailer">
					<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zM16 6h2v12h-2z"/></svg>
				</button>
				<button class="btn btn-ghost btn-theater" id="theaterBtn" type="button" aria-pressed="false" aria-label="Theater mode" title="Theater mode (T)">
					<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2 5h2v14H2zm18 0h2v14h-2zM6 12l4-4v3h4V8l4 4-4 4v-3h-4v3z"/></svg>
					<span>Theater</span>
				</button>
			</div>
			<div class="status-row">
				<p class="status" id="status" role="status" aria-live="polite">Loading genres…</p>
			</div>
			<p class="error" id="err" role="alert"></p>

			<article class="movie" id="movie" hidden>
				<div class="movie-poster" id="poster"></div>
				<div class="movie-body">
					<h1 class="movie-title" id="movieTitle"></h1>
					<p class="movie-meta">
						<span id="releaseDate"></span>
						<span id="rating"></span>
					</p>
					<p class="movie-overview" id="movieInfo"></p>
					<p class="movie-links" id="canistreamlink"></p>
				</div>
			</article>
		</section>

		<aside class="filters" aria-label="Filters">
			<details id="filterPanel" open>
				<summary>
					<span>Filters</span>
					<span class="filter-summary" id="filterSummary">Popular, any genre</span>
				</summary>

				<form id="filterForm" class="filter-form">
					<fieldset>
						<legend>Show me</legend>
						<div class="chips" id="listChips">
							<label class="chip"><input type="radio" name="list" value="popular" checked><span>Popular</span></label>
							<label class="chip"><input type="radio" name="list" value="top_rated"><span>Top rated</span></label>
							<label class="chip"><input type="radio" name="list" value="now_playing"><span>In theaters</span></label>
							<label class="chip"><input type="radio" name="list" value="upcoming"><span>Coming soon</span></label>
						</div>
					</fieldset>

					<fieldset>
						<legend>
							Genres
							<span class="legend-hint">pick as many as you like</span>
						</legend>
						<div class="chips" id="genreChips">
							<span class="muted">Loading genres…</span>
						</div>
						<div class="segmented" role="radiogroup" aria-label="How to combine genres">
							<label><input type="radio" name="genreMode" value="any" checked><span>Any of these</span></label>
							<label><input type="radio" name="genreMode" value="all"><span>All of these</span></label>
						</div>
					</fieldset>

					<fieldset>
						<legend>
							MPAA rating
							<span class="legend-hint">any you pick</span>
						</legend>
						<div class="chips" id="mpaaChips">
							<label class="chip"><input type="checkbox" name="mpaa" value="G"><span>G</span></label>
							<label class="chip"><input type="checkbox" name="mpaa" value="PG"><span>PG</span></label>
							<label class="chip"><input type="checkbox" name="mpaa" value="PG-13"><span>PG-13</span></label>
							<label class="chip"><input type="checkbox" name="mpaa" value="R"><span>R</span></label>
							<label class="chip"><input type="checkbox" name="mpaa" value="NC-17"><span>NC-17</span></label>
						</div>
					</fieldset>

					<fieldset>
						<legend><label for="ratingMinimum">Minimum score</label> <output id="ratingValue" for="ratingMinimum">Any</output></legend>
						<input id="ratingMinimum" name="minRating" type="range" min="0" max="9" step="0.5" value="0">
					</fieldset>

					<fieldset>
						<legend><label for="actorText">Actors</label> <span class="legend-hint">separate with commas</span></legend>
						<input id="actorText" name="actors" type="text" placeholder="e.g. Tom Hanks, Meg Ryan" autocomplete="off">
					</fieldset>

					<div class="filter-actions">
						<button class="btn btn-start" type="submit" id="applyBtn">Start with these filters</button>
						<button class="btn btn-ghost" type="button" id="resetBtn">Reset</button>
					</div>
				</form>
			</details>
		</aside>
	</main>

	<footer class="footer">
		Movie data from <a href="https://www.themoviedb.org/">The Movie DB</a>. Made by <a href="https://www.joshwein.xyz">Josh Wein</a>.
	</footer>

	<script src="js/ytapi.js?v=6"></script>
	<script src="js/scripts.js?v=6"></script>
	<script src="https://apis.google.com/js/client.js"></script>
	<script src="https://www.youtube.com/iframe_api"></script>
	<script src="/__/firebase/7.15.0/firebase-app.js"></script>
	<script src="/__/firebase/7.15.0/firebase-remote-config.js"></script>
	<script src="/__/firebase/init.js"></script>
</body>
</html>
